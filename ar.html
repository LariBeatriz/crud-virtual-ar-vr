<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Biblioteca Virtual — Modo AR</title>

  <!--
    Versões testadas nesta página (não trocar sem revalidar compatibilidade):
      - A-Frame 1.6.0, via CDN oficial.
      - AR.js 3.4.8 (build baseado em marcador), via RawGitHack apontando
        para a TAG "3.4.8" do repositório AR-js-org/AR.js — nunca para
        "master", para que a versão usada não mude sozinha no futuro.

    Como usar o modo AR:
      1) Esta página PRECISA ser aberta por HTTP(S) (ex.: servidor local
         "python3 -m http.server" em localhost, ou uma URL HTTPS real como a
         porta encaminhada pelo GitHub Codespaces, ou GitHub Pages). Abrir
         como arquivo local (file://) impede o navegador de liberar a webcam
         e pode quebrar o carregamento de texturas — ver README.md.
      2) Imprima ou exiba em outra tela o marcador padrão "Hiro" do AR.js
         (é o marcador quadrado preto com o desenho estilizado da palavra
         "HIRO" dentro). O README.md explica onde consegui-lo.
      3) Ao abrir esta página, permita o acesso à câmera quando solicitado.
      4) Aponte a câmera do dispositivo para o marcador: a estante com os
         livros aparece ancorada sobre ele. Toque/clique num livro para
         selecioná-lo, igual ao modo VR de index.html.
  -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="cabecalho">
    <h1>📚 Biblioteca Virtual — AR</h1>
    <a href="index.html">Voltar ao modo 3D</a>
  </header>

  <div class="aviso-ar">Aponte a câmera para o marcador "Hiro" para ver a estante.</div>

  <!-- ============================ CENA AR.js ============================ -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-assets></a-assets>

    <!-- Luzes fora do marcador: continuam iluminando a estante mesmo que o
         marcador saia/entre do quadro. -->
    <a-light type="ambient" color="#BBB"></a-light>
    <a-light type="directional" color="#FFF" intensity="0.6" position="1 3 2"></a-light>

    <!--
      Câmera exigida explicitamente pelo AR.js: é nela que o componente
      "arjs" aplica o vídeo da webcam e a estimativa de pose do marcador.
      Sem um cursor/raycaster aqui, os livros dentro do marcador não
      responderiam a clique/toque — o AR.js não adiciona isso por padrão.
    -->
    <a-entity camera>
      <a-cursor
        id="cursor-ar"
        fuse="false"
        raycaster="objects: .clickable"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
        material="color: #FFF; shader: flat"
      ></a-cursor>
    </a-entity>

    <a-marker preset="hiro">
      <!--
        Mesma estrutura DOM e mesmos ids de index.html, só que em escala
        menor (a unidade "1" do A-Frame vira o tamanho do marcador físico
        impresso). app.js não sabe — nem precisa saber — que está dentro de
        um marcador: ele só enxerga #estrutura-estante e #livros-container.
      -->
      <a-entity id="biblioteca-root" position="0 0 0" scale="0.28 0.28 0.28">
        <a-entity id="estrutura-estante"></a-entity>
        <a-entity id="livros-container"></a-entity>
      </a-entity>
    </a-marker>
  </a-scene>

  <!-- ============================ PAINEL CRUD ============================ -->
  <!-- Mesma estrutura e mesmos ids de index.html: app.js espera exatamente
       estes elementos para funcionar, independente do modo (VR ou AR). -->
  <aside class="painel-crud">
    <h2 id="titulo-formulario">Adicionar livro</h2>

    <ul id="erros-formulario" class="lista-erros" hidden></ul>

    <form id="formulario-livro">
      <div class="campo">
        <label for="campo-titulo">Título</label>
        <input id="campo-titulo" type="text" required />
      </div>

      <div class="campo">
        <label for="campo-autor">Autor</label>
        <input id="campo-autor" type="text" required />
      </div>

      <div class="campo">
        <label for="campo-genero">Gênero</label>
        <input id="campo-genero" type="text" list="lista-generos" required />
        <datalist id="lista-generos">
          <option value="Fantasia"></option>
          <option value="Ficção Científica"></option>
          <option value="Romance"></option>
          <option value="Terror"></option>
          <option value="Suspense"></option>
          <option value="História"></option>
          <option value="Biografia"></option>
          <option value="Distopia"></option>
        </datalist>
      </div>

      <div class="campo">
        <label for="campo-ano">Ano</label>
        <input id="campo-ano" type="number" required />
      </div>

      <div class="campo">
        <label for="campo-sinopse">Sinopse</label>
        <textarea id="campo-sinopse" required></textarea>
      </div>

      <div class="campo">
        <label for="campo-cor">Cor</label>
        <input id="campo-cor" type="color" value="#8B4513" required />
      </div>

      <div class="campo">
        <label for="campo-capa">Capa (URL ou caminho, opcional)</label>
        <input id="campo-capa" type="text" placeholder="assets/capas/exemplo.jpg" />
      </div>

      <div class="linha-botoes">
        <button id="botao-adicionar" type="submit" class="botao-primario">Adicionar livro</button>
        <button id="botao-salvar" type="submit" class="botao-primario" hidden>Salvar alterações</button>
        <button id="botao-cancelar" type="button" class="botao-secundario" hidden>Cancelar edição</button>
      </div>
    </form>

    <section id="painel-detalhes" class="painel-detalhes" hidden>
      <h3 id="detalhe-titulo"></h3>
      <dl>
        <dt>Autor</dt>
        <dd id="detalhe-autor"></dd>
        <dt>Gênero</dt>
        <dd id="detalhe-genero"></dd>
        <dt>Ano</dt>
        <dd id="detalhe-ano"></dd>
        <dt>Sinopse</dt>
        <dd id="detalhe-sinopse"></dd>
      </dl>
      <div class="linha-botoes">
        <button id="botao-editar-detalhe" type="button" class="botao-secundario">Editar</button>
        <button id="botao-excluir-detalhe" type="button" class="botao-perigo">Excluir</button>
        <button id="botao-fechar-detalhe" type="button" class="botao-secundario">Fechar</button>
      </div>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
