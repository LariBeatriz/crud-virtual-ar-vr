<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Biblioteca Virtual</title>

  <!--
    A-Frame 1.6.0 — versão fixada e testada com este projeto (ver README.md).
    Não atualizar sem validar antes a compatibilidade com o AR.js usado em ar.html.
  -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="cabecalho">
    <h1>📚 Biblioteca Virtual</h1>
    <a href="ar.html">Ver em Realidade Aumentada</a>
  </header>

  <!-- ============================== CENA 3D ============================== -->
  <!--
    Sala fechada em torno da estante (paredes, teto, tapete, luminárias e
    alguns elementos de decoração), só para ambientação — nenhum desses
    elementos guarda dado algum; é cenário estático ao redor de
    #biblioteca-root, que continua sendo o único ponto de transformação que
    app.js e a estrutura de dados conhecem.
  -->
  <a-scene cursor="rayOrigin: mouse" fog="type: linear; color: #D9C7A3; near: 8; far: 17">
    <a-assets></a-assets>

    <!-- Câmera SEM wasd-controls: o usuário não anda pela sala, só olha ao
         redor (look-controls é só rotação, não move a posição). Isso evita
         o personagem se afastar/atravessar a estante e mantém o foco na
         interação por clique com os livros.

         Aqui a seleção é por CLIQUE: a cena usa "rayOrigin: mouse", então a
         mira acompanha o ponteiro. O fuse (gaze) fica desligado de
         propósito neste modo — com a mira parada no centro da tela, ele
         dispararia sozinho ao carregar a página e abriria a capa de um
         livro qualquer sem o usuário ter feito nada. A seleção por gaze
         está em ar.html, onde faz sentido (o aparelho é apontado com a
         mão e não existe ponteiro do mouse). -->
    <a-camera position="0.5 1.55 -0.1" look-controls>
      <a-cursor
        id="cursor-principal"
        fuse="false"
        raycaster="objects: .clickable"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
        material="color: #FFE9C2; shader: flat; opacity: 0.9"
        animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.6 0.6 0.6; to: 1 1 1"
      ></a-cursor>
    </a-camera>

    <a-light type="ambient" color="#E8D9BE" intensity="0.5"></a-light>
    <a-light type="directional" color="#FFF3DE" intensity="0.4" position="1 3 2"></a-light>

    <!-- Chão (madeira), teto e as 4 paredes formam uma sala fechada.
         roughness alto e metalness zero tiram o brilho "plástico" do
         material padrão, deixando as superfícies foscas como madeira e
         reboco de verdade. -->
    <a-plane position="0 0 -0.5" rotation="-90 0 0" width="9" height="9"
             material="color: #5A3A22; roughness: 0.95; metalness: 0"></a-plane>
    <a-plane position="0 4.2 -0.5" rotation="90 0 0" width="9" height="9"
             material="color: #EFE3C8; roughness: 1; metalness: 0"></a-plane>
    <a-box position="0 2.1 -5" width="9" height="4.2" depth="0.1"
           material="color: #D9C7A3; roughness: 1; metalness: 0"></a-box>
    <a-box position="0 2.1 4" width="9" height="4.2" depth="0.1"
           material="color: #D9C7A3; roughness: 1; metalness: 0"></a-box>
    <a-box position="-4.5 2.1 -0.5" width="0.1" height="4.2" depth="9"
           material="color: #CBB78E; roughness: 1; metalness: 0"></a-box>
    <a-box position="4.5 2.1 -0.5" width="0.1" height="4.2" depth="9"
           material="color: #CBB78E; roughness: 1; metalness: 0"></a-box>

    <!-- Rodapés: faixas escuras no encontro entre parede e chão. Detalhe
         barato que tira o aspecto de "caixa vazia" da sala. -->
    <a-box position="0 0.09 -4.9" width="9" height="0.18" depth="0.06"
           material="color: #4A2E1A; roughness: 0.9"></a-box>
    <a-box position="-4.4 0.09 -0.5" width="0.06" height="0.18" depth="9"
           material="color: #4A2E1A; roughness: 0.9"></a-box>
    <a-box position="4.4 0.09 -0.5" width="0.06" height="0.18" depth="9"
           material="color: #4A2E1A; roughness: 0.9"></a-box>

    <!-- Tapete em frente à estante, em duas camadas (borda + centro) -->
    <a-box position="0 0.01 -1.9" width="3.3" height="0.02" depth="1.7"
           material="color: #5E1717; roughness: 1"></a-box>
    <a-box position="0 0.025 -1.9" width="2.9" height="0.02" depth="1.36"
           material="color: #7A1F1F; roughness: 1"></a-box>

    <!-- Luminárias penduradas, com luz quente para destacar a estante. O
         cilindro fino é o fio até o teto: sem ele as cúpulas parecem
         flutuando no ar. -->
    <a-entity position="-2.2 3.6 -2.4">
      <a-cylinder radius="0.012" height="0.62" position="0 0.48 0"
                  material="color: #2A1D12; roughness: 0.9"></a-cylinder>
      <a-cylinder radius="0.25" height="0.35" material="color: #3A2A1A; roughness: 0.85"></a-cylinder>
      <a-sphere radius="0.12" position="0 -0.2 0"
                material="color: #FFE9C2; shader: flat"></a-sphere>
      <a-light type="point" color="#FFD9A0" intensity="0.75" distance="9" position="0 -0.2 0"></a-light>
    </a-entity>
    <a-entity position="2.2 3.6 -2.4">
      <a-cylinder radius="0.012" height="0.62" position="0 0.48 0"
                  material="color: #2A1D12; roughness: 0.9"></a-cylinder>
      <a-cylinder radius="0.25" height="0.35" material="color: #3A2A1A; roughness: 0.85"></a-cylinder>
      <a-sphere radius="0.12" position="0 -0.2 0"
                material="color: #FFE9C2; shader: flat"></a-sphere>
      <a-light type="point" color="#FFD9A0" intensity="0.75" distance="9" position="0 -0.2 0"></a-light>
    </a-entity>

    <!-- Janela na parede direita: o painel claro com "shader: flat" simula o
         vidro iluminado e a luz pontual espalha essa claridade pela sala. -->
    <a-entity position="4.42 2.2 -1">
      <a-box width="0.1" height="1.9" depth="1.4"
             material="color: #4A2E1A; roughness: 0.9"></a-box>
      <a-box width="0.04" height="1.6" depth="1.1" position="-0.05 0 0"
             material="color: #DCE9F0; shader: flat"></a-box>
      <a-box width="0.03" height="1.6" depth="0.05" position="-0.07 0 0"
             material="color: #4A2E1A; roughness: 0.9"></a-box>
      <a-box width="0.03" height="0.05" depth="1.1" position="-0.07 0 0"
             material="color: #4A2E1A; roughness: 0.9"></a-box>
    </a-entity>
    <a-light type="point" color="#CFE2F2" intensity="0.45" distance="8" position="3.9 2.2 -1"></a-light>

    <!-- Cantinho de leitura: planta de vaso perto da parede -->
    <a-entity position="-3.6 0 -1">
      <a-cylinder position="0 0.25 0" radius="0.18" height="0.5"
                  material="color: #5C3A22; roughness: 0.9"></a-cylinder>
      <a-cylinder position="0 0.51 0" radius="0.19" height="0.06"
                  material="color: #43291A; roughness: 0.9"></a-cylinder>
      <a-sphere position="0 0.78 0" radius="0.34"
                material="color: #3F6B3F; roughness: 1"></a-sphere>
      <a-sphere position="0.16 0.58 0.1" radius="0.17"
                material="color: #4B7A45; roughness: 1"></a-sphere>
    </a-entity>

    <!-- Quadros na parede esquerda -->
    <a-entity position="-4.4 2.2 -2">
      <a-box width="0.06" height="0.9" depth="0.7" material="color: #3A2A1A; roughness: 0.85"></a-box>
      <a-box width="0.03" height="0.7" depth="0.5" position="0.02 0 0"
             material="color: #9C6B3E; roughness: 0.9"></a-box>
    </a-entity>
    <a-entity position="-4.4 2.1 0.6">
      <a-box width="0.06" height="0.7" depth="0.55" material="color: #3A2A1A; roughness: 0.85"></a-box>
      <a-box width="0.03" height="0.52" depth="0.38" position="0.02 0 0"
             material="color: #6E7A56; roughness: 0.9"></a-box>
    </a-entity>

    <!--
      biblioteca-root é o único ponto de transformação da biblioteca inteira.
      app.js nunca escreve nele: só manipula o que está dentro de
      #estrutura-estante e #livros-container. Isso permite que index.html e
      ar.html posicionem a mesma estante de formas completamente diferentes
      (aqui, fixa à frente da câmera; em ar.html, escalada para caber sobre o
      marcador Hiro) sem que app.js precise saber em qual modo está rodando.
    -->
    <a-entity id="biblioteca-root" position="0 0 -3">
      <a-entity id="estrutura-estante"></a-entity>
      <a-entity id="livros-container"></a-entity>
    </a-entity>
  </a-scene>

  <!-- ============================ PAINEL CRUD ============================ -->
  <aside class="painel-crud">
    <h2 id="titulo-formulario">Adicionar livro</h2>

    <ul id="erros-formulario" class="lista-erros" hidden></ul>

    <form id="formulario-livro">
      <div class="campo">
        <label for="campo-titulo">Título</label>
        <input id="campo-titulo" type="text" required />
      </div>

      <div class="campo">
        <label for="campo-autor">Autor</label>
        <input id="campo-autor" type="text" required />
      </div>

      <div class="campo">
        <label for="campo-genero">Gênero</label>
        <input id="campo-genero" type="text" list="lista-generos" required />
        <datalist id="lista-generos">
          <option value="Fantasia"></option>
          <option value="Ficção Científica"></option>
          <option value="Romance"></option>
          <option value="Terror"></option>
          <option value="Suspense"></option>
          <option value="História"></option>
          <option value="Biografia"></option>
          <option value="Distopia"></option>
        </datalist>
      </div>

      <div class="campo">
        <label for="campo-ano">Ano</label>
        <input id="campo-ano" type="number" required />
      </div>

      <div class="campo">
        <label for="campo-sinopse">Sinopse</label>
        <textarea id="campo-sinopse" required></textarea>
      </div>

      <div class="campo">
        <label for="campo-cor">Cor</label>
        <input id="campo-cor" type="color" value="#8B4513" required />
      </div>

      <div class="campo">
        <label for="campo-capa">Capa (URL ou caminho, opcional)</label>
        <input id="campo-capa" type="text" placeholder="assets/capas/exemplo.jpg" />
      </div>

      <!--
        Os seis botões abaixo cobrem os três modos do formulário (ver
        entrarModoCriacao/entrarModoVisualizacao/entrarModoEdicao em app.js):
        cada modo mostra só os botões que fazem sentido nele, escondendo os
        demais via o atributo "hidden".
      -->
      <div class="linha-botoes">
        <button id="botao-adicionar" type="submit" class="botao-primario">Adicionar livro</button>
        <button id="botao-salvar" type="submit" class="botao-primario" hidden>Salvar alterações</button>
        <button id="botao-cancelar" type="button" class="botao-secundario" hidden>Cancelar edição</button>
        <button id="botao-editar-detalhe" type="button" class="botao-secundario" hidden>Editar</button>
        <button id="botao-excluir-detalhe" type="button" class="botao-perigo" hidden>Excluir</button>
        <button id="botao-fechar-detalhe" type="button" class="botao-secundario" hidden>Fechar</button>
      </div>
    </form>
  </aside>

  <!--
    Preview em tela cheia da capa do livro selecionado. Clicar no fundo
    escurecido (fora da capa/fallback) fecha o preview e volta para a
    interface normal — ver configurarOverlayCapa() em app.js.
  -->
  <div id="overlay-capa" class="overlay-capa" hidden>
    <div id="overlay-capa-conteudo" class="overlay-capa-conteudo"></div>
    <p class="overlay-capa-dica">Clique fora da capa para voltar</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
